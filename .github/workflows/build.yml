name: Build Arch package

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: pacman -Suy --noconfirm --needed base-devel sudo ccache

      - name: Number of processors
        run: nproc

      - name: Free memory
        run: free -h

      - name: Show disk space
        run: df -h .

      - name: Patch makepkg.conf
        run: |
          sed -Ei "s/^#(MAKEFLAGS=).*$/\\1\"-j$(nproc)\"/; /^OPTIONS=/ s/debug //" /etc/makepkg.conf
          sed -Ei '/^BUILDENV=/ s/!ccache/ccache/' /etc/makepkg.conf
          cat /etc/makepkg.conf

      - name: Create non root user
        run: |
          useradd builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/builder

      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Change ownership
        run: |
          chown -R builder:builder .
          mkdir -p /home/builder/.cache/ccache /home/builder/.cargo
          chown -R builder:builder /home/builder/.cache /home/builder/.cargo

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Build Arch Linux package
        run: sudo -u builder makepkg --syncdeps --noconfirm

      - name: Show ccache statistics
        run: sudo -u builder ccache -s

      - name: Disk space after
        run: df -h .

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: telegram-desktop-no-ads
          path: "*.zst"
